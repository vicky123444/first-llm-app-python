[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-app"
version = "0.1.0"
description = "A terminal-based LLM question answering assistant built with Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Project" }]
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "httpx<0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
